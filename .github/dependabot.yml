version: 2
updates:
  # Weekly was noisy: 4 ecosystems x staggered slots + one-off security PRs
  # (security updates are always individual, they bypass groups). Fortnightly,
  # one ecosystem per weekday, keeps the cadence calm.
  #
  # NOTE: semver-major npm updates are ignored everywhere on purpose. Web prod
  # majors are deliberate migrations (see repo_improvements.md), web dev +
  # api majors are surfaced monthly by the `dep-refresh` workflow instead.

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: fortnightly
      day: monday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 3
    groups:
      root-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # @types/node majors track Node.js majors (see engines / Dockerfile)
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: fortnightly
      day: tuesday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 3
    groups:
      api-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # Rewrites SHA-pinned actions in place (keeps commit-SHA pinning + comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: fortnightly
      day: wednesday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: fortnightly
      day: thursday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 3
